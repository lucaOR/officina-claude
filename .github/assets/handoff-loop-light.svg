<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 338 614" width="338" height="614" role="img" aria-labelledby="dg-title dg-desc" class="dg dg-workflow"><style>svg.dg{--dg-ink:var(--ink, #1d1d1f);--dg-muted:var(--muted, #5b6474);--dg-panel:var(--panel, #fff);--dg-line:#64748b;--dg-lane:rgba(100, 116, 139, .06);--dg-rule:#cbd5e1;--dg-emphasis:#059669;--dg-security:#e11d48;--dg-dashed:#7c3aed;--dg-frontend:#0891b2;--dg-backend:#059669;--dg-database:#7c3aed;--dg-cloud:#d97706;--dg-security:#e11d48;--dg-messagebus:#ea580c;--dg-external:#64748b}svg.dg{display:block;max-width:100%;height:auto;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}svg.dg text{fill:var(--dg-ink)}svg.dg .t-frontend{--dg-t:var(--dg-frontend)}svg.dg .t-backend{--dg-t:var(--dg-backend)}svg.dg .t-database{--dg-t:var(--dg-database)}svg.dg .t-cloud{--dg-t:var(--dg-cloud)}svg.dg .t-security{--dg-t:var(--dg-security)}svg.dg .t-messagebus{--dg-t:var(--dg-messagebus)}svg.dg .t-external{--dg-t:var(--dg-external)}svg.dg .dg-node .dg-shape{fill:color-mix(in srgb, var(--dg-t) 12%, var(--dg-panel));stroke:var(--dg-t);stroke-width:1.5}svg.dg .dg-node-label{font-size:13px;font-weight:600}svg.dg .dg-lane rect{fill:var(--dg-lane);stroke:var(--dg-rule)}svg.dg .dg-lane text{fill:var(--dg-muted);font-size:12px;font-weight:600}svg.dg .dg-edge,svg.dg .dg-msg,svg.dg .dg-rel{fill:none;stroke:var(--dg-line);stroke-width:1.5}svg.dg .dg-edge.v-emphasis,svg.dg .dg-msg.v-emphasis{stroke:var(--dg-emphasis);stroke-width:2}svg.dg .dg-edge.v-security,svg.dg .dg-msg.v-security{stroke:var(--dg-security);stroke-dasharray:6 4}svg.dg .dg-edge.v-dashed,svg.dg .dg-msg.v-dashed{stroke:var(--dg-dashed);stroke-dasharray:4 4}svg.dg .dg-msg.v-return{stroke-dasharray:4 4}svg.dg .dg-head{fill:var(--dg-line)}svg.dg .dg-head.v-emphasis{fill:var(--dg-emphasis)}svg.dg .dg-head.v-security{fill:var(--dg-security)}svg.dg .dg-head.v-dashed{fill:var(--dg-dashed)}svg.dg .dg-open{fill:none;stroke:var(--dg-line);stroke-width:1.5}svg.dg .dg-elabel rect{fill:var(--dg-panel);stroke:var(--dg-rule);stroke-width:.75}svg.dg .dg-elabel text{fill:var(--dg-muted);font-size:11px}svg.dg .dg-elabel.v-emphasis text{fill:var(--dg-emphasis)}svg.dg .dg-elabel.v-security text{fill:var(--dg-security)}svg.dg .dg-elabel.v-dashed text{fill:var(--dg-dashed)}svg.dg .dg-life{stroke:var(--dg-rule);stroke-dasharray:3 5}svg.dg .dg-band{fill:var(--dg-lane);stroke:var(--dg-rule);stroke-dasharray:6 5}svg.dg .dg-phase-label rect{fill:var(--dg-panel);stroke:var(--dg-rule)}svg.dg .dg-phase-label text{fill:var(--dg-muted);font-size:11px;font-weight:600}svg.dg .dg-head-band{fill:color-mix(in srgb, var(--dg-t) 16%, var(--dg-panel))}svg.dg .dg-entity .dg-shape{fill:var(--dg-panel);stroke:none}svg.dg .dg-outline{fill:none;stroke:var(--dg-t);stroke-width:1.5}svg.dg .dg-etitle{font-size:13px;font-weight:700}svg.dg .dg-zebra{fill:var(--dg-lane)}svg.dg .dg-field{font-size:12px}svg.dg .dg-field.dg-pk{font-weight:700}svg.dg .dg-ftype{fill:var(--dg-muted);font-size:11px}svg.dg .dg-key rect{stroke:none}svg.dg .dg-key text{font-size:9px;font-weight:700}svg.dg .k-pk rect{fill:color-mix(in srgb, var(--dg-database) 18%, var(--dg-panel))}svg.dg .k-pk text{fill:var(--dg-database)}svg.dg .k-fk rect{fill:color-mix(in srgb, var(--dg-messagebus) 18%, var(--dg-panel))}svg.dg .k-fk text{fill:var(--dg-messagebus)}svg.dg .k-uk rect{fill:none;stroke:var(--dg-rule);stroke-width:1}svg.dg .k-uk text{fill:var(--dg-muted)}svg.dg .dg-card{fill:none;stroke:var(--dg-line);stroke-width:1.5}</style><rect width="100%" height="100%" fill="#ffffff"/><title id="dg-title">Session handoff</title><desc id="dg-desc">Workflow of 7 steps.</desc><defs><marker id="dg-arrow-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dg-head v-default"/></marker><marker id="dg-arrow-emphasis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="