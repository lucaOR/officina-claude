<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 556" width="224" height="556" role="img" aria-labelledby="dg-title dg-desc" class="dg dg-workflow"><style>svg.dg{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}svg.dg{--dg-ink:var(--ink, #1d1d1f);--dg-muted:var(--muted, #5b6474);--dg-panel:var(--panel, #fff);--dg-line:#64748b;--dg-lane:rgba(100, 116, 139, .06);--dg-rule:#cbd5e1;--dg-emphasis:#059669;--dg-security:#e11d48;--dg-dashed:#7c3aed;--dg-frontend:#0891b2;--dg-backend:#059669;--dg-database:#7c3aed;--dg-cloud:#d97706;--dg-security:#e11d48;--dg-messagebus:#ea580c;--dg-external:#64748b}svg.dg{--dg-ink:var(--ink, #ececee);--dg-muted:var(--muted, #9c9ca4);--dg-panel:var(--panel, #1e1e21);--dg-line:#94a3b8;--dg-lane:rgba(148, 163, 184, .06);--dg-rule:#3b4250;--dg-emphasis:#34d399;--dg-security:#fb7185;--dg-dashed:#a78bfa;--dg-frontend:#22d3ee;--dg-backend:#34d399;--dg-database:#a78bfa;--dg-cloud:#fbbf24;--dg-security:#fb7185;--dg-messagebus:#fb923c;--dg-external:#94a3b8}svg.dg .dg{display:block;max-width:100%;height:auto;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}svg.dg .dg text{fill:var(--dg-ink)}svg.dg .t-frontend{--dg-t:var(--dg-frontend)}svg.dg .t-backend{--dg-t:var(--dg-backend)}svg.dg .t-database{--dg-t:var(--dg-database)}svg.dg .t-cloud{--dg-t:var(--dg-cloud)}svg.dg .t-security{--dg-t:var(--dg-security)}svg.dg .t-messagebus{--dg-t:var(--dg-messagebus)}svg.dg .t-external{--dg-t:var(--dg-external)}svg.dg .dg-node .dg-shape{fill:color-mix(in srgb, var(--dg-t) 12%, var(--dg-panel));stroke:var(--dg-t);stroke-width:1.5}svg.dg .dg-node-label{font-size:13px;font-weight:600}svg.dg .dg-lane rect{fill:var(--dg-lane);stroke:var(--dg-rule)}svg.dg .dg-lane text{fill:var(--dg-muted);font-size:12px;font-weight:600}svg.dg .dg-edge,svg.dg .dg-msg,svg.dg .dg-rel{fill:none;stroke:var(--dg-line);stroke-width:1.5}svg.dg .dg-edge.v-emphasis,svg.dg .dg-msg.v-emphasis{stroke:var(--dg-emphasis);stroke-width:2}svg.dg .dg-edge.v-security,svg.dg .dg-msg.v-security{stroke:var(--dg-security);stroke-dasharray:6 4}svg.dg .dg-edge.v-dashed,svg.dg .dg-msg.v-dashed{stroke:var(--dg-dashed);stroke-dasharray:4 4}svg.dg .dg-msg.v-return{stroke-dasharray:4 4}svg.dg .dg-head{fill:var(--dg-line)}svg.dg .dg-head.v-emphasis{fill:var(--dg-emphasis)}svg.dg .dg-head.v-security{fill:var(--dg-security)}svg.dg .dg-head.v-dashed{fill:var(--dg-dashed)}svg.dg .dg-open{fill:none;stroke:var(--dg-line);stroke-width:1.5}svg.dg .dg-elabel rect{fill:var(--dg-panel);stroke:var(--dg-rule);stroke-width:.75}svg.dg .dg-elabel text{fill:var(--dg-muted);font-size:11px}svg.dg .dg-elabel.v-emphasis text{fill:var(--dg-emphasis)}svg.dg .dg-elabel.v-security text{fill:var(--dg-security)}svg.dg .dg-elabel.v-dashed text{fill:var(--dg-dashed)}svg.dg .dg-life{stroke:var(--dg-rule);stroke-dasharray:3 5}svg.dg .dg-band{fill:var(--dg-lane);stroke:var(--dg-rule);stroke-dasharray:6 5}svg.dg .dg-phase-label rect{fill:var(--dg-panel);stroke:var(--dg-rule)}svg.dg .dg-phase-label text{fill:var(--dg-muted);font-size:11px;font-weight:600}svg.dg .dg-head-band{fill:color-mix(in srgb, var(--dg-t) 16%, var(--dg-panel))}svg.dg .dg-entity .dg-shape{fill:var(--dg-panel);stroke:none}svg.dg .dg-outline{fill:none;stroke:var(--dg-t);stroke-width:1.5}svg.dg .dg-etitle{font-size:13px;font-weight:700}svg.dg .dg-zebra{fill:var(--dg-lane)}svg.dg .dg-field{font-size:12px}svg.dg .dg-field.dg-pk{font-weight:700}svg.dg .dg-ftype{fill:var(--dg-muted);font-size:11px}svg.dg .dg-key rect{stroke:none}svg.dg .dg-key text{font-size:9px;font-weight:700}svg.dg .k-pk rect{fill:color-mix(in srgb, var(--dg-database) 18%, var(--dg-panel))}svg.dg .k-pk text{fill:var(--dg-database)}svg.dg .k-fk rect{fill:color-mix(in srgb, var(--dg-messagebus) 18%, var(--dg-panel))}svg.dg .k-fk text{fill:var(--dg-messagebus)}svg.dg .k-uk rect{fill:none;stroke:var(--dg-rule);stroke-width:1}svg.dg .k-uk text{fill:var(--dg-muted)}svg.dg .dg-card{fill:none;stroke:var(--dg-line);stroke-width:1.5}</style><rect width="100%" height="100%" fill="#0d1117"/><title id="dg-title">Session handoff</title><desc id="dg-desc">Workflow of 6 steps.</desc><defs><marker id="dg-arrow-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dg-head v-default"/></marker><marker id="dg-arrow-emphasis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dg-head v-emphasis"/></marker><marker id="dg-arrow-security" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dg-head v-security"/></marker><marker id="dg-arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dg-head v-dashed"/></marker><marker id="dg-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" class="dg-open"/></marker></defs><path class="dg-edge v-default" d="M109 56 L109 64 Q109 70 103 70 L99 70 Q93 70 93 76 L93 100" marker-end="url(#dg-arrow-default)"/><path class="dg-edge v-default" d="M93 154 L93 198" marker-end="url(#dg-arrow-default)"/><path class="dg-edge v-default" d="M93 242 L93 286" marker-end="url(#dg-arrow-default)"/><path class="dg-edge v-default" d="M93 340 L93 348 Q93 354 99 354 L109 354 Q115 354 115 360 L115 398" marker-end="url(#dg-arrow-default)"/><path class="dg-edge v-emphasis" d="M115 442 L115 500" marker-end="url(#dg-arrow-emphasis)"/><path class="dg-edge v-dashed" d="M126 398 L126 360 Q126 354 132 354 L179 354 Q185 354 185 348 L185 258 Q185 256 183 256 L183 256 Q181 256 181 254 L181 170.5 Q181 168 178.5 168 L178.5 168 Q176 168 176 165.5 L176 76 Q176 70 170 70 L128 70 Q122 70 122 64 L122 56" marker-end="url(#dg-arrow-dashed)"/><g class="dg-elabel v-emphasis"><rect x="100" y="462" width="30" height="18" rx="4"/><text x="115" y="474.9" text-anchor="middle">yes</text></g><g class="dg-elabel v-dashed"><rect x="107.5" y="360" width="37" height="18" rx="4"/><text x="126" y="372.9" text-anchor="middle">pivot</text></g><g data-node-id="work" data-node-label="Work on task" class="dg-node t-frontend"><title>Work on task</title><rect class="dg-shape" x="49" y="12" width="120" height="44" rx="8"/><text class="dg-node-label" text-anchor="middle"><tspan x="109" y="38.6">Work on task</tspan></text></g><g data-node-id="note" data-node-label="/session:handoff writes note" class="dg-node t-backend"><title>/session:handoff writes note</title><rect class="dg-shape" x="22" y="100" width="142" height="54" rx="8"/><text class="dg-node-label" text-anchor="middle"><tspan x="93" y="123.1">/session:handoff</tspan><tspan x="93" y="140.1">writes note</tspan></text></g><g data-node-id="clear" data-node-label="/clear" class="dg-node t-external"><title>/clear</title><rect class="dg-shape" x="45" y="198" width="96" height="44" rx="8"/><text class="dg-node-label" text-anchor="middle"><tspan x="93" y="224.6">/clear</tspan></text></g><g data-node-id="read" data-node-label="Next session reads note" class="dg-node t-backend"><title>Next session reads note</title><rect class="dg-shape" x="12.5" y="286" width="161" height="54" rx="8"/><text class="dg-node-label" text-anchor="middle"><tspan x="93" y="309.1">Next session reads</tspan><tspan x="93" y="326.1">note</tspan></text></g><g data-node-id="gate" data-node-label="Intent still matches?" class="dg-node t-security dg-decision"><title>Intent still matches?</title><path class="dg-shape" d="M32 398H198L212 420L198 442H32L18 420Z"/><text class="dg-node-label" text-anchor="middle"><tspan x="115" y="424.6">Intent still matches?</tspan></text></g><g data-node-id="go" data-node-label="Continue" class="dg-node t-cloud"><title>Continue</title><rect class="dg-shape" x="67" y="500" width="96" height="44" rx="8"/><text class="dg-node-label" text-anchor="middle"><tspan x="115" y="526.6">Continue</tspan></text></g></svg>