<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="officina-claude: Claude Code plugins from the workshop">
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-anchor:middle;fill:#1d1d1f}
.mark{font-size:88px;font-weight:700;letter-spacing:-1px}
.accent,.peg{fill:#D97757}
.sub{font-size:28px;fill:#5b6474}
.chips rect{fill:#D97757;fill-opacity:0.08;stroke:#D97757;stroke-opacity:0.55;stroke-width:1.5}
.chips text{font-size:22px;font-weight:500}
.tool{fill:#c9d0d8}
.cut{fill:#ffffff}
.ticks{stroke:#ffffff;stroke-width:3}
</style>
<rect width="1280" height="320" fill="#ffffff"/>
<!-- Pegboard: 32 px holes fading towards the middle, with tools hung on accent pegs at the sides. -->
<defs>
<pattern id="holes" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="16" cy="16" r="2.5" fill="#1d1d1f" fill-opacity="0.16"/></pattern>
<linearGradient id="fade"><stop offset="0" stop-color="#fff"/><stop offset=".26" stop-color="#000"/><stop offset=".74" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient>
<mask id="sides"><rect width="1280" height="320" fill="url(#fade)"/></mask>
</defs>
<rect width="1280" height="320" fill="url(#holes)" mask="url(#sides)"/>
<g class="tool">
<circle cx="48" cy="84" r="15"/><rect x="42" y="90" width="12" height="130"/><circle cx="48" cy="230" r="17"/>
<rect x="100" y="40" width="24" height="76" rx="10"/><rect x="104" y="114" width="16" height="8" rx="2"/><rect x="109" y="120" width="6" height="58"/>
<rect x="1156" y="40" width="24" height="152" rx="3"/>
<rect x="1225" y="72" width="14" height="156" rx="7"/><path d="M1262 214h-20v6h-28q-10 0-16-16q0 20 16 28h28v6h20z"/>
</g>
<g class="cut">
<circle cx="48" cy="84" r="7"/><path d="M41 250v-14h14v14z"/>
<circle cx="112" cy="50" r="6"/>
<circle cx="1168" cy="50" r="6"/><path class="ticks" d="M1156 76h8M1156 100h12M1156 124h8M1156 148h12M1156 172h8"/>
<circle cx="1232" cy="82" r="5"/>
</g>
<circle class="peg" cx="48" cy="80" r="4"/><circle class="peg" cx="112" cy="48" r="4"/><circle class="peg" cx="1168" cy="48" r="4"/><circle class="peg" cx="1232" cy="80" r="4"/>
<text class="mark" x="640" y="132">officina<tspan class="accent">-claude</tspan></text>
<text class="sub" x="640" y="182">Claude Code plugins from the workshop</text>
<!-- Chip widths fit DejaVu Sans, the widest common system-ui fallback; labels are centred, so narrower fonts only add padding. -->
<g class="chips">
<rect x="153" y="222" width="121" height="44" rx="22"/><text x="213.5" y="251.5">session</text>
<rect x="286" y="222" width="198" height="44" rx="22"/><text x="385" y="251.5">token-hygiene</text>
<rect x="496" y="222" width="252" height="44" rx="22"/><text x="622" y="251.5">planner-companion</text>
<rect x="760" y="222" width="143" height="44" rx="22"/><text x="831.5" y="251.5">diagrams</text>
<rect x="915" y="222" width="213" height="44" rx="22"/><text x="1021.5" y="251.5">scenario-matrix</text>
</g>
</svg>
